name: Required Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group is intentionally absent: the merge queue runs the fast
  # merge-queue-smoke.yml workflow instead (single merge-queue-smoke job, <5 min).
  # Re-running every job here per queue entry starved the runner pool and
  # pushed queue merges to 70-90 min.

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. lint ────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-debug-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-debug-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      # Runs clang-format, clang-tidy (via debug build), ruff, mypy, and
      # actionlint inside the CI container with the workspace + conan cache
      # mounted.
      - name: Lint (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              ./scripts/format.sh --check
              ruff check clients/python/
              conan install . --build=missing -s build_type=Debug --output-folder build/debug >/dev/null
              cmake --preset debug -DAgamemnon_ENABLE_CLANG_TIDY=ON
              cmake --build --preset debug
              cd clients/python && uv sync --locked && uv run mypy src/
              cd /workspace
              actionlint
            '

      - name: Run merge-queue workflow regression
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              cd clients/python && uv sync --locked
              uv run python -m pytest tests/test_ci_workflows.py -v
            '

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265  # v20.0.0
        with:
          # markdownlint-cli2 does NOT read .markdownlintignore (that file is
          # cli-v1 only — the #437 fix was ineffective); exclusions must be
          # negation globs here. Keep in sync with .markdownlintignore.
          globs: |
            **/*.md
            !.claude-prompt-*.md
          config: ".markdownlint.yaml"

  uv-check:
    name: uv-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      # Assert every committed uv.lock is in sync with its pyproject.toml
      # (ADR-018: uv replaces pixi). `uv lock --check` fails if the lockfile
      # would change, i.e. it was not regenerated after a manifest edit.
      - name: Check all lockfiles (in container)
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace agamemnon-ci:local \
            bash -c 'set -euo pipefail; uv lock --check; cd agamemnon && uv lock --check; cd ../clients/python && uv lock --check'

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          # Scans Agamemnon sources. Matches the forbidden idiom at end
          # of line or before a trailing comment. See
          # HomericIntelligence/Odysseus#280.
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          # Skip this workflow file itself (heredoc would otherwise self-match).
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found continue-on-error true above; fix root cause.'
            echo '::error::See HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  # ── 2. unit-tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Build + run unit tests (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release -s compiler=gcc -s compiler.version=13 -s compiler.libcxx=libstdc++11 -s compiler.cppstd=20 --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release
              ctest --preset release --output-on-failure --timeout 120
            '

  # ── 3. integration-tests ───────────────────────────────────────────────────
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Build + run integration tests (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release -s compiler=gcc -s compiler.version=13 -s compiler.libcxx=libstdc++11 -s compiler.cppstd=20 --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release
              cd build/release
              if ctest -L integration --output-on-failure --dry-run 2>&1 | grep -q "No tests were found"; then
                echo "No '"'"'integration'"'"' label found — running full test suite"
                ctest --output-on-failure
              else
                ctest -L integration --output-on-failure
              fi
            '

  # ── 4. security/dependency-scan ────────────────────────────────────────────
  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      # pip-audit + trivy + conan SBOM + grype scans, all inside the container.
      # Security scanners (trivy/syft/grype) are pinned in ci/Containerfile.
      - name: Dependency + SBOM scans (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              cd clients/python && uv run --only-group lint pip-audit --skip-editable
              cd /workspace
              trivy fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln .
              conan profile detect --exist-ok >/dev/null 2>&1
              conan lock create conanfile.py --lockfile-out=conan.lock --build=missing >/dev/null
              syft . --override-default-catalogers conan -o cyclonedx-json=conan-sbom.cdx.json
              grype sbom:conan-sbom.cdx.json --fail-on high --output table
              grype sbom:.github/cpp-fetchcontent-deps.cdx.json --fail-on high --output table
            '

      - name: Upload C++ SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cpp-sbom
          path: |
            conan-sbom.cdx.json
            .github/cpp-fetchcontent-deps.cdx.json
          retention-days: 90

  # ── 5. security/secrets-scan ───────────────────────────────────────────────
  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Gitleaks enforcement regression guard
        # Fails the build if a silent gitleaks invocation (exit-code zero) is
        # ever reintroduced into this workflow file. See
        # HomericIntelligence/Agamemnon#266.
        # NOTE: matches only actual `gitleaks ... --exit-code 0` command
        # invocations, so the guard's own descriptive text does not self-match.
        run: |
          if grep -nE '^[[:space:]]*gitleaks[[:space:]].*--exit-code[[:space:]]+0([[:space:]]|$)' \
               .github/workflows/_required.yml; then
            echo "::error::silent gitleaks invocation detected; enforcement must remain strict"
            exit 1
          fi

      - name: Run Gitleaks
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              if [ -f .gitleaks.toml ]; then
                gitleaks detect --source . --config .gitleaks.toml \
                  --report-format sarif --report-path gitleaks.sarif --exit-code 1
              else
                gitleaks detect --source . \
                  --report-format sarif --report-path gitleaks.sarif --exit-code 1
              fi
            '

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  # ── 6. build ───────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Configure + build (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release
            '

  # ── 7. schema-validation ───────────────────────────────────────────────────
  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Validate GitHub Actions workflow schemas (in container)
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace agamemnon-ci:local \
            bash -c 'find .github/workflows -name "*.yml" | sort | xargs check-jsonschema --schemafile .github/schemas/github-workflow.json'

  # ── 8. deps/version-sync ───────────────────────────────────────────────────
  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Check CMakeLists.txt vs conanfile.py version consistency (in container)
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace agamemnon-ci:local \
            python3 scripts/check-version-sync.py

  # ── 9. test (aggregate) ────────────────────────────────────────────────────
  # Canonical aggregate for the Ecosystem CI Status board. Surfaces a single
  # `test` check-run that gates on the split suites (unit-tests +
  # integration-tests) without duplicating their work. The sub-checks remain
  # first-class and are kept as-is.
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    steps:
      - name: Aggregate test results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          set -euo pipefail
          echo "unit-tests:        $UNIT_RESULT"
          echo "integration-tests: $INTEGRATION_RESULT"
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "::error::unit-tests did not succeed"
            exit 1
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::integration-tests did not succeed"
            exit 1
          fi
          echo "OK: all test suites passed"

  # ── 10. package ────────────────────────────────────────────────────────────
  # Builds the distributable release archive: a clean `cmake --install` tree
  # (server + healthcheck binaries, library, CMake export targets) plus the
  # CycloneDX SBOM, tarred into a versioned artifact. Runs on every push/PR to
  # main so the board's `package` cell reflects whether the distributable can
  # still be produced (the tag-gated docker/PyPI publish jobs stay separate).
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Build + stage install tree (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          set -euo pipefail
          podman run --rm -i \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -s > /tmp/agamemnon-package.out <<'EOF'
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release >/dev/null
              cmake --install build/release --prefix "$PWD/stage" >/dev/null
              echo "staged install tree:"
              find stage -maxdepth 3 -type f | sort
              VERSION=$(grep -oP 'kVersion\{"\\K[^"]+' include/agamemnon/version.hpp)
              echo "Packaging version $VERSION"
              syft dir:stage -o cyclonedx-json=stage-sbom.cdx.json
              ARCHIVE="Agamemnon-${VERSION}-linux-x86_64.tar.gz"
              tar -czf "$ARCHIVE" -C stage .
              echo "Created $ARCHIVE"
              ls -lh "$ARCHIVE"
              tar -tzf "$ARCHIVE" | grep -q "bin/Agamemnon_server"
              echo "ARCHIVE=$ARCHIVE"
          EOF
          ARCHIVE=$(sed -n 's/^ARCHIVE=//p' /tmp/agamemnon-package.out | tail -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::package job did not report ARCHIVE"
            cat /tmp/agamemnon-package.out
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-release-archive
          path: |
            ${{ env.ARCHIVE }}
            stage-sbom.cdx.json
          retention-days: 30

  # ── 11. install ────────────────────────────────────────────────────────────
  # Clean-install smoke test: builds, runs `cmake --install` into a fresh
  # prefix, and verifies the installed binaries are present and runnable
  # (server + healthcheck) and that the CMake package config files land where
  # downstream consumers expect them.
  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Build + clean install + verify (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release
              cmake --install build/release --prefix "$PWD/prefix"
              PREFIX="$PWD/prefix"
              echo "── installed tree ──"
              find "$PREFIX" -maxdepth 3 | sort
              SERVER="$PREFIX/bin/Agamemnon_server"
              HEALTH="$PREFIX/bin/Agamemnon_healthcheck"
              test -x "$SERVER" || { echo "::error::missing installed binary: $SERVER"; exit 1; }
              test -x "$HEALTH" || { echo "::error::missing installed binary: $HEALTH"; exit 1; }
              test -f "$PREFIX/lib/cmake/Agamemnon/AgamemnonTargets.cmake" \
                || { echo "::error::missing installed CMake export targets"; exit 1; }
              ls "$PREFIX"/lib/libAgamemnon.* >/dev/null 2>&1 \
                || { echo "::error::missing installed Agamemnon library"; exit 1; }
              echo "OK: clean install smoke test passed"
            '

  # ── 12. release (dry-run) ──────────────────────────────────────────────────
  # Release-readiness validation that runs on every push/PR to main WITHOUT
  # publishing anything. It checks that the version is consistent across all
  # release sources and that the CHANGELOG has an Unreleased section ready to
  # promote. The real publish (PyPI + GHCR) stays tag-gated in
  # python-client-release.yml / docker-publish.yml.
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-agamemnon-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-agamemnon-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .

      - name: Validate release readiness (dry-run, no publish) (in container)
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace agamemnon-ci:local \
            python3 scripts/check-release-readiness.py
