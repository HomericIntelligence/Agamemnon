# Supplemental merge-queue smoke check.
#
# The required workflows also run for the queue commit and supply the live
# required contexts. This fast smoke job is additional validation; its result
# does not replace the required build, test, or security checks.
name: Merge Queue Smoke

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mq-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-smoke:
    name: merge-queue-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Borrowed from schema-validation: validate every workflow against the
      # vendored GitHub Actions schema.
      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate GitHub Actions workflow schemas
        run: |
          find .github/workflows -name "*.yml" | sort | \
            xargs check-jsonschema \
              --schemafile .github/schemas/github-workflow.json

      # Borrowed from lint: actionlint (includes shellcheck of run blocks).
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/actionlint.tar.gz actionlint
          actionlint --version

      - name: Lint GitHub Actions workflows
        run: actionlint

      # Borrowed from lint: fast Python client lint.
      - name: Install ruff
        run: pip install ruff

      - name: Python client lint
        run: ruff check clients/python/
