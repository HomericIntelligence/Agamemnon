name: Static Analysis

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-ci-image:
    name: Prepare CI image (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .
      - name: Push CI image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          podman tag agamemnon-ci:local ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}
          podman push ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check formatting
        run: ./scripts/format.sh --check
      - name: Prune stale podman storage (self-hosted disk pressure)
        run: |
          podman container prune -af --volumes=false 2>/dev/null || exit 0
          podman system prune -af --volumes=false || exit 0



  clang-tidy:
    name: clang-tidy
    needs: prepare-ci-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prune stale podman storage (self-hosted disk pressure)
        run: |
          podman container prune -af --volumes=false 2>/dev/null || exit 0
          podman system prune -af --volumes=false || exit 0




      - name: Pull CI image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          podman pull ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}
          podman tag ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }} agamemnon-ci:local

      - name: Configure + build with clang-tidy (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          mkdir -p "$HOME/.conan2"
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              export CC=clang CXX=clang++
              conan install . --build=missing -s build_type=Debug \
                -s compiler=clang -s compiler.version=18 \
                -s compiler.libcxx=libstdc++11 -s compiler.cppstd=20 \
                --output-folder build/debug >/dev/null
              cmake --preset debug -DAgamemnon_ENABLE_CLANG_TIDY=ON
              cmake --build --preset debug
            '

  check-all:
    name: All Static Analysis Checks
    runs-on: ubuntu-24.04
    needs: [clang-format, clang-tidy]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          CLANG_FORMAT_RESULT: ${{ needs.clang-format.result }}
          CLANG_TIDY_RESULT: ${{ needs.clang-tidy.result }}
        run: |
          if [ "$CLANG_FORMAT_RESULT" != "success" ] || \
             [ "$CLANG_TIDY_RESULT" != "success" ]; then
            echo "Static analysis failed"
            exit 1
          fi
          echo "All checks passed"
