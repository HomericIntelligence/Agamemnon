name: Code Coverage

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-container-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  prepare-ci-image:
    name: Prepare CI image (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t agamemnon-ci:local .
      - name: Push CI image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          podman tag agamemnon-ci:local ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}
          podman push ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}

  coverage:
    name: Coverage
    needs: prepare-ci-image
    runs-on: [self-hosted, self-hosted-aeolus]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Prune stale podman storage (self-hosted disk pressure)
        run: |
          podman container prune -af --volumes=false 2>/dev/null || exit 0
          podman system prune -af --volumes=false || exit 0




      - name: Pull CI image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          podman pull ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }}
          podman tag ghcr.io/homericintelligence/agamemnon-ci:${{ github.sha }} agamemnon-ci:local

      - name: Configure + build + test + coverage (in container)
        env:
          CONAN_HOME: /home/ci/.conan2
        run: |
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace agamemnon-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Debug \
                -s compiler=gcc -s compiler.version=13 \
                -s compiler.libcxx=libstdc++11 -s compiler.cppstd=20 \
                --output-folder build/coverage >/dev/null
              cmake --preset coverage
              cmake --build --preset coverage
              ctest --preset coverage
              ./scripts/coverage.sh
              # TODO: Raise threshold back to 80% once additional C++ tests land.
              # Current actual line coverage is ~77.2% (run 25640957315, 2026-05-10).
              # Target: 80% line coverage. Tracking ratchet upward as tests are added.
              LINE_COV=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse("build/coverage-report/coverage.xml").getroot(); print(f\"{float(root.attrib.get("line-rate", 0)) * 100:.1f}\")")
              echo "Line coverage: ${LINE_COV}%"
              python3 -c "import sys; cov=float("${LINE_COV}"); sys.exit(0 if cov >= 75 else 1)"
            '

  check-all:
    name: All Coverage Checks
    runs-on: ubuntu-24.04
    needs: [coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$COVERAGE_RESULT" != "success" ]; then
            echo "Coverage check failed"
            exit 1
          fi
          echo "All checks passed"
