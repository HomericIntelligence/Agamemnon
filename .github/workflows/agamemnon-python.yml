name: Agamemnon Python CI

on:
  push:
    branches: [main]
    paths:
      - "agamemnon/**"
      - ".github/workflows/agamemnon-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "agamemnon/**"
      - ".github/workflows/agamemnon-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Sync (uv)
        working-directory: agamemnon
        run: uv sync --locked

      - name: Run ruff
        working-directory: agamemnon
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Sync (uv)
        working-directory: agamemnon
        run: uv sync --locked

      - name: Run mypy
        working-directory: agamemnon
        run: uv run mypy src/agamemnon/

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Sync (uv)
        working-directory: agamemnon
        run: uv sync --locked

      - name: Run tests
        working-directory: agamemnon
        run: uv run pytest tests/ -v
