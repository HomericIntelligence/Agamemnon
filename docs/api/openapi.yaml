openapi: "3.1.0"

info:
  title: Agamemnon API
  version: "0.1.0"
  description: |
    REST API for Agamemnon — the planning, coordination, and agentic orchestration
    service for the HomericIntelligence distributed agent mesh.

    **Authentication:** All endpoints (except `/health` and `/v1/health`) require an API key
    configured through `AGAMEMNON_API_KEY`. Two header forms are accepted:

    * `Authorization: Bearer <key>`
    * `X-API-Key: <key>`

    The server refuses to start when `AGAMEMNON_API_KEY` is unset or empty, before
    connecting to the broker or starting projection services.

    **Transport:** Internal mesh traffic only (no TLS). Intended to be reached over Tailscale
    (100.x.x.x) or localhost.

    **NATS side-effects:** Some mutating endpoints publish events to NATS subjects;
    research and planned-issue intake imports persist metadata without dispatch. See the
    `x-nats-events` extension field on each operation and `docs/api/nats-events.md` for the
    full reference.

servers:
  - url: http://localhost:8080
    description: Local development (default port; override with PORT env var)
  - url: http://{tailscaleHost}:{port}
    description: |
      Production / mesh access over Tailscale. Requires the caller to be
      authenticated to the same tailnet. `tailscaleHost` is either the peer's
      Tailscale IPv4 address (`100.x.y.z`) or its MagicDNS name.
    variables:
      tailscaleHost:
        default: 100.64.0.1
        description: Tailscale IPv4 (100.x.y.z) or MagicDNS hostname of the Agamemnon peer
      port:
        default: "8080"
        description: Port Agamemnon is listening on (PORT env var; default 8080)

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: fleet
    description: Durable Fleet control and derived projections
  - name: health
    description: Health and version checks
  - name: agents
    description: Agent lifecycle management
  - name: teams
    description: Team management
  - name: tasks
    description: Task management (scoped to teams)
  - name: workflows
    description: Workflow management (placeholder — not yet implemented)
  - name: chaos
    description: |
      **Fault registry only — actual fault injection is not yet wired.**
      These endpoints record fault declarations and broadcast them over NATS
      so external chaos drivers (e.g. ProjectCharybdis) can observe the
      registry, but the Agamemnon server does NOT itself apply latency,
      partition, crash, or error behaviour based on the registered faults.
      In-process fault injection is tracked in issue #408.
  - name: HMAS
    description: |
      Hierarchical Multi-Agent System (HMAS) orchestration — submit researched
      briefs, retrieve generated task trees, and drive L0–L3 state transitions
      (escalate / complete / state lookup).

paths:
  /v1/fleet/build-jobs/submit:
    post:
      tags: [fleet]
      operationId: fleetSubmitBuild
      summary: Admit one subordinate tool build without changing its parent claim
      description: >-
        Requires a registered immutable first-profile policy, qualified tool
        capacity with a separately configured supervisor authority, and an eligible
        currently observed parent with its exact canonical claim. Persists one reservation and start
        intent before Keystone publication. Admission does not verify snapshot
        bytes or authorize process execution. Exact submission replay is a read
        that returns the historical record and start command; it never republishes.
        New admission is unavailable when the operator removes the catalog.
      x-nats-events:
        - subject: hi.fleet.control.{workerId}
          description: Typed build start command after confirmed durable admission; absent on replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/BuildSubmit'}
      responses:
        '202':
          description: Durable admission or exact historical replay; no process-start guarantee
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildSubmitResponse'}
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409': {$ref: './fleet.yaml#/components/responses/BuildConflict'}
        '413': {$ref: './fleet.yaml#/components/responses/BuildTooLarge'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
        '507': {$ref: './fleet.yaml#/components/responses/BuildFull'}
  /v1/fleet/build-jobs/{id}:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    get:
      tags: [fleet]
      operationId: fleetGetBuild
      summary: Read a retained build record
      description: >-
        Existing generic GET route. Typed records carry build.schema
        hi/fleet/build/v1 and a separate tool reservation; legacy generic build
        records retain their existing shape. Reading status does not deliver a
        command or authorize a run. Recovery remains available after admission
        policy removal. collectionVerified false is not an independently verified
        result; terminal child status never resolves the parent's issue.
      x-nats-events: []
      responses:
        '200':
          description: Retained typed or legacy generic build record
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/FleetReadableRecord'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
  /v1/fleet/build-jobs/{id}/deliver:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetDeliverBuild
      summary: Retry delivery of the same admitted start intent
      description: >-
        Requires a typed build in admitted status with reserved capacity, pending
        original start intent and no grant, plus the exact currently eligible
        parent claim. Revalidates the parent even after hydration; an unknown or
        stale parent blocks delivery. Republishes the same retained command with
        no durable mutation or new attempt. A consumer must deduplicate delivery.
      x-nats-events:
        - subject: hi.fleet.control.{workerId}
          description: Exact retained typed start command after current-parent validation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/BuildDelivery'}
      responses:
        '202':
          description: Same start intent delivered; run grant is still required
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildSubmitResponse'}
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409': {$ref: './fleet.yaml#/components/responses/BuildConflict'}
        '413': {$ref: './fleet.yaml#/components/responses/BuildTooLarge'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
  /v1/fleet/build-jobs/{id}/claim-run:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetClaimBuildRun
      summary: Persist or replay one supervisor run grant
      description: >-
        Requires both API authentication and the separately bound supervisor key.
        A new grant revalidates current parent eligibility and is ordered with
        parent stop under the Fleet mutex. Stop-before-grant denies a new grant;
        grant-before-stop authorizes the retained attempt. Later parent stop cannot
        retract an already durable grant or make controller authorization atomic
        with a remote process start. Exact claim replay returns the historical
        grant and original command, including after parent stop or cancellation;
        it grants no new attempt. The supervisor must retain its stop fence and
        journal the grant before launching, so replay cannot launch a second process.
      security:
        - bearerAuth: []
          buildKey: []
        - apiKeyAuth: []
          buildKey: []
      x-nats-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/BuildClaim'}
      responses:
        '200':
          description: One confirmed durable grant or exact historical replay
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildGrantResponse'}
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '403': {$ref: './fleet.yaml#/components/responses/BuildForbidden'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409': {$ref: './fleet.yaml#/components/responses/BuildConflict'}
        '413': {$ref: './fleet.yaml#/components/responses/BuildTooLarge'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
        '507': {$ref: './fleet.yaml#/components/responses/BuildFull'}
  /v1/fleet/build-jobs/{id}/cancel:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetCancelBuild
      summary: Persist or replay typed build cancellation or an existing generic cancel
      description: >-
        The retained record selects the contract. A typed build requires BuildCancel
        with schema hi/fleet/build-cancel/v1, generation and attempt, and no payload;
        a legacy generic build continues to use CommandRequest. Typed cancellation
        persists an exact stop before publication and preserves its reservation.
        It remains available after parent invalidation or admission catalog removal.
        Exact pending-stop replay may republish the same command. ACK, publication
        and parent stop do not release tool capacity; only an exact trusted cancelled
        fact with the stop command, start fence and confirmed cleanup releases it.
      x-nats-events:
        - subject: hi.fleet.control.{workerId}
          description: Retained cancel intent after persistence, or pending-stop replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: './fleet.yaml#/components/schemas/BuildCancel'
                - $ref: './fleet.yaml#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Typed record/command or legacy command/status; stop may still be pending
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: './fleet.yaml#/components/schemas/BuildCancelResponse'
                  - $ref: './fleet.yaml#/components/schemas/LegacyCommandResponse'
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409': {$ref: './fleet.yaml#/components/responses/BuildConflict'}
        '413': {$ref: './fleet.yaml#/components/responses/BuildTooLarge'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
        '507': {$ref: './fleet.yaml#/components/responses/BuildFull'}
  /v1/fleet/build-jobs/{id}/facts:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetBuildFact
      summary: Record one trusted terminal cleanup fact for a subordinate build
      description: >-
        Requires normal API authentication and the dedicated supervisor authority
        matching the retained worker/allocation/generation, including during
        recovery with admission disabled. The closed fact binds every command,
        attempt, policy, parameters, snapshot and execution-platform identity.
        A matching terminal fact with owned-process cleanup releases only the child
        tool reservation. Missing evidence references report incomplete; present
        references report unverified. collectionVerified remains false. No inline
        logs, collector success flag, HMAS claim change or parent issue resolution
        is accepted. Generic ACK/HTTP events/unqualified NATS events are not a
        supervisor authority path for typed builds.
      security:
        - bearerAuth: []
          buildKey: []
        - apiKeyAuth: []
          buildKey: []
      x-nats-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/BuildFact'}
      responses:
        '200':
          description: Terminal fact durably retained or exactly replayed; tool reservation released
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildFactResponse'}
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '403': {$ref: './fleet.yaml#/components/responses/BuildForbidden'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409': {$ref: './fleet.yaml#/components/responses/BuildConflict'}
        '413': {$ref: './fleet.yaml#/components/responses/BuildTooLarge'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503': {$ref: './fleet.yaml#/components/responses/BuildUnavailable'}
        '507': {$ref: './fleet.yaml#/components/responses/BuildFull'}
  /v1/fleet/build-jobs/{id}/logs:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    get:
      tags: [fleet]
      operationId: fleetBuildLogs
      summary: Read one bounded UTF-8 log page from the configured local backend
      description: >-
        Only stream, after and limit query keys are accepted, at most once each.
        No caller URL, path, attempt, snapshotDigest or backend credential is
        accepted. The controller uses the admitted build/attempt/snapshot identity
        and its separately configured backend credential to request
        GET /v1/fleet/build-jobs/{id}/logs with attempt, snapshotDigest, stream,
        after and limit on the private backend. The first backend profile permits
        only literal http://127.0.0.1:<port> or http://[::1]:<port>, with an explicit
        decimal port from 1 through 65535 and no leading zero. HTTPS, DNS names,
        external origins, alternate numeric host spellings, URL credentials,
        paths, queries and fragments are rejected. Redirects and proxies are
        disabled. Connection timeout is 500 ms and total timeout is 1000 ms;
        response body is capped at 400000 bytes including JSON escaping. Duplicate
        response keys, nesting beyond 16, malformed/oversized data and any identity,
        range or digest mismatch fail closed. Reads never modify the durable
        record or event history. An empty backend configuration returns 503;
        real backend/executor qualification and remote transport remain pending.
      x-nats-events: []
      parameters:
        - name: stream
          in: query
          schema: {type: string, enum: [stdout, stderr], default: stdout}
        - name: after
          in: query
          description: Unsigned decimal byte offset; signs, fractions and exponents are rejected.
          schema:
            type: integer
            minimum: 0
            maximum: 9223372036854775807
            default: 0
        - name: limit
          in: query
          description: Maximum returned UTF-8 bytes; unsigned decimal integer only.
          schema: {type: integer, minimum: 1, maximum: 65536, default: 65536}
      responses:
        '200':
          description: Identity-bound bounded log page; complete requires a manifest
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildLogPage'}
        '400': {$ref: './fleet.yaml#/components/responses/BuildInvalid'}
        '401': {$ref: './fleet.yaml#/components/responses/BuildUnauthorized'}
        '404': {$ref: './fleet.yaml#/components/responses/BuildMissing'}
        '409':
          description: Target is a legacy generic record or backend cursor is ahead of available output
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildError'}
        '429': {$ref: './fleet.yaml#/components/responses/BuildRateLimited'}
        '503':
          description: >-
            Durable record unavailable, local backend unconfigured/unavailable,
            connection/response timeout, or invalid backend configuration/response.
            No durable state changes and no fabricated empty successful page.
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/BuildError'}
  /v1/fleet/issue-intakes/repositories:
    get:
      tags: [fleet]
      operationId: fleetIssueIntakeRepositories
      summary: List the configured planned-issue repository selections
      description: >-
        Authenticated finite public projection of the operator registry. Does not
        contact GitHub, approve a plan or validate current repository identity.
        No query parameters are accepted. Requires the shared issue-intake
        configuration and durable import-state branch; configuration paths and
        credentials are never returned.
      x-nats-events: []
      responses:
        '200':
          description: Configured repository keys and canonical names/native IDs
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueRepositories'}
        '400':
          description: Query parameters are not accepted
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '401':
          description: Missing or invalid existing Agamemnon API credential
        '429':
          description: Existing API rate limit exceeded
        '503':
          description: Issue import is disabled; issue_import_unavailable
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
  /v1/fleet/issue-intakes/{repositoryKey}/{issueNumber}:
    get:
      tags: [fleet]
      operationId: fleetInspectIssueIntake
      summary: Inspect a registered work issue and exact selected plan snapshot
      description: >-
        Uses a fixed GitHub read under one 30-second operation deadline. Returns
        canonical identity, title, open/closed state and an exact content digest,
        without persisting anything or returning issue/plan text. The selected
        plan is the issue body unless planCommentId identifies a comment on that
        same issue. Only that optional query parameter is accepted, exactly once;
        digests, timestamps, URLs and alternate origins are not query inputs.
        Inspection is optional and does not prove plan approval or stage eligibility.
        A subsequent explicit import repeats identity and snapshot validation.
      x-nats-events: []
      parameters:
        - name: repositoryKey
          in: path
          required: true
          description: Exact key from the operator registry
          schema: {$ref: './fleet.yaml#/components/schemas/IssueRepositoryKey'}
        - name: issueNumber
          in: path
          required: true
          description: Canonical positive decimal integer, with no sign or leading zero
          schema: {type: integer, minimum: 1, maximum: 2147483647}
        - name: planCommentId
          in: query
          required: false
          description: Explicit opaque node ID of a comment belonging to the selected issue
          schema: {$ref: './fleet.yaml#/components/schemas/IssueNativeId'}
      responses:
        '200':
          description: Canonical inspection; the work issue may be open or closed
          headers:
            X-API-Version:
              description: Current Agamemnon API version
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueInspection'}
        '400':
          description: Malformed or unknown selection, or an unsupported/duplicate query parameter
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '401':
          description: Missing or invalid existing Agamemnon API credential
        '404':
          description: Registered repository lookup reports no such work issue; issue_not_found
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '429':
          description: Existing API rate limit exceeded
        '503':
          description: >-
            Disabled service, bounded lookup failure, invalid canonical repository
            identity, invalid comment parent, or empty/oversized selected content
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
  /v1/fleet/issue-intakes:
    post:
      tags: [fleet]
      operationId: fleetImportIssueIntake
      summary: Import one selected planned GitHub issue as a durable Pending implementation leaf
      description: >-
        Requires authenticated durable persistence and the operator-owned
        AGAMEMNON_ISSUE_INTAKE_CONFIG registry plus AGAMEMNON_IMPORT_STATE_BRANCH
        in the existing backing repository. No query parameters are accepted.
        The closed body is limited to 4096 raw UTF-8 bytes; duplicate JSON keys,
        invalid UTF-8 and unknown fields are rejected. An expected repositoryId
        that differs from the selected registry entry is rejected before I/O.
        Fixed GitHub lookup revalidates the native issue identity and exact selected
        plan digest. One 30-second deadline covers lookup, Store lock acquisition,
        complete backing enumeration, conditional fence writes and the possible
        single backing-issue create. Timeout or a lost write response may leave an
        uncertain persisted result; caller disconnect does not cancel persistence.

        Direct and research imports share a canonical work-issue creation fence.
        Only this invocation's confirmed prepared write can advance to a confirmed
        creating grant and one create. Any retained prepared/creating record permits
        observation/reconciliation only; an empty scan, elapsed time or restart
        does not reset it. A uniquely matching durable task can be replayed with
        unchanged state, ownership and provenance. A task of the other intake kind
        returns work_issue_already_imported, never a receipt of the requested kind.

        A new leaf is standalone L3, Pending and unassigned, with no claim, children
        or dependencies. Import does not call Nestor, approve plan content, create
        another work issue, dispatch work, start a session or publish NATS messages.
        Existing Fleet admission and start/input/respond remain separate. Generic
        task reads retain the existing HMAS shape; the receipt is not an activity view.
        See docs/fleet.md for configuration, rollout and recovery requirements.
      x-nats-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/IssueImport'}
      responses:
        '201':
          description: One new durable Pending L3 implementation leaf; no dispatch occurred
          headers:
            X-API-Version:
              description: Current Agamemnon API version
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportReceipt'}
        '200':
          description: Exact replay with current canonical task state and original provenance/observedAt
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportReceipt'}
        '400':
          description: >-
            Invalid closed request/query, unknown registry selection, or expected
            repositoryId inconsistent with the selected operator entry before I/O
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '401':
          description: Missing or invalid existing Agamemnon API credential
        '404':
          description: Registered repository lookup reports no such work issue; issue_not_found
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '409':
          description: >-
            Changed expected issue identity or selected snapshot; closed work issue
            before first creation; conflicting, ambiguous, closed or malformed
            backing identity. A research owner of this work issue returns
            work_issue_already_imported without a direct-intake receipt.
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '413':
          description: Raw request exceeds 4096 bytes; invalid_issue_import
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
        '429':
          description: Existing API rate limit exceeded
        '503':
          description: >-
            Disabled/missing authority, bounded GitHub failure, incomplete scan,
            busy lock, or uncertain persistence/fence requiring reconciliation.
            This response does not establish that no write occurred.
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/IssueImportError'}
  /v1/fleet/research-intakes:
    post:
      tags: [fleet]
      operationId: fleetImportResearchIntake
      summary: Import one confirmed Nestor intake as a durable Pending L3 leaf
      description: >-
        Requires a configured Nestor authority, authenticated GitHub persistence,
        and the shared operator repository registry/import-state branch. Reads the
        supported Nestor v1 generation-1 metadata record within the existing
        5-second lookup deadline and verifies its digest and confirmed issue receipt.
        The subsequent GitHub reconciliation, Store lock and conditional attempt
        fence share a separate 30-second deadline. New admission resolves the
        Nestor-confirmed work issue against the registered canonical repository.
        Exact replay preserves the existing research task ID, provenance and state.
        Only this invocation's confirmed prepared fence write can grant one create;
        retained prepared/creating records allow observation/reconciliation only.
        Timeout, disconnect, restart or an empty scan never resets that permission.
        Direct and research imports cannot each own the same work issue.
        Does not create a canonical research issue, TaskBrief, Fleet session or NATS
        publication. Existing worker admission and Fleet start/input/respond remain
        separate. Duplicate JSON keys, extra fields and invalid UTF-8 are rejected.
      x-nats-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/ResearchImport'}
      responses:
        '201':
          description: New durable, unassigned Pending L3 leaf; no dispatch occurred
          headers:
            X-API-Version:
              description: Current Agamemnon API version
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportReceipt'}
        '200':
          description: Unique open backing record replayed with current state and ownership
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportReceipt'}
        '400':
          description: Invalid metadata request or serialized body exceeds 4096 bytes
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportError'}
        '401':
          description: Missing or invalid existing Agamemnon API credential
        '404':
          description: Configured Nestor authority reports no such intake
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportError'}
        '409':
          description: >-
            Unconfirmed or changed intake, or ambiguous/closed/malformed backing
            identity. A direct-intake owner of the work issue returns
            work_issue_already_imported, never a research receipt.
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportError'}
        '429':
          description: Existing API rate limit exceeded
        '503':
          description: >-
            Import disabled, authority unavailable/invalid, bounded reconciliation
            or lock unavailable, or persistence uncertain. Does not prove no write occurred.
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ResearchImportError'}
  /v1/fleet/projects:
    get:
      tags: [fleet]
      operationId: fleetProjectsHealth
      summary: Inspect the configured derived ProjectV2 view
      description: Reports configuration and retryable projection health without changing canonical state.
      responses:
        '200':
          description: Projection health, including disabled and retryable failures
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ProjectsHealth'}
  /v1/fleet/projects/reconcile:
    post:
      tags: [fleet]
      operationId: fleetProjectsReconcile
      summary: Rebuild explicitly configured ProjectV2 fields from durable issues
      description: >-
        Never modifies canonical task state or Hephaestus labels. Concurrent
        requests return the current running status. Disabled configuration performs no writes.
      responses:
        '200':
          description: Projection result; inspect state and retryable fields
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/ProjectsHealth'}
  /v1/fleet/{kind}:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Kind'
    get:
      tags: [fleet]
      operationId: fleetList
      summary: Read Fleet records and their last observed activity
      description: Returns durable ownership alongside the latest observed runtime activity.
      responses:
        '200':
          description: Records owned by Agamemnon
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: {$ref: './fleet.yaml#/components/schemas/FleetReadableRecord'}
                  total: {type: integer, minimum: 0}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
    post:
      tags: [fleet]
      operationId: fleetCreate
      summary: Persist a resource without dispatching work
      description: Requires a confirmed GitHub write before the resource becomes available.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/Create'}
      responses:
        '201':
          description: GitHub acknowledged the resource
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/Record'}
        '400': {$ref: './fleet.yaml#/components/responses/Invalid'}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
  /v1/fleet/{kind}/{id}:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Kind'
      - $ref: './fleet.yaml#/components/parameters/Id'
    get:
      tags: [fleet]
      operationId: fleetGet
      summary: Inspect a Fleet resource
      description: Returns the current control generation and explicit ownership metadata.
      responses:
        '200':
          description: Resource with explicit ownership and observations
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/FleetReadableRecord'}
        '404': {$ref: './fleet.yaml#/components/responses/Missing'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
  /v1/fleet/{kind}/{id}/{operation}:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Kind'
      - $ref: './fleet.yaml#/components/parameters/Id'
      - name: operation
        in: path
        required: true
        schema:
          type: string
          enum: [start, input, respond, interrupt, cancel, resume, drain]
    post:
      tags: [fleet]
      operationId: fleetCommand
      summary: Persist intent before Keystone publication
      description: >-
        Reuse commandId and idempotencyKey when delivery is uncertain. Only a
        worker confirmation completes a stop. Pool control and worker startup
        require allocation adapters and currently return 409. Drain applies to workers.
        Typed subordinate builds accept only BuildCancel here, selected by the
        retained record; the explicit build-jobs/{id}/cancel path documents that
        contract. Other generic commands return 409 for typed builds. Existing
        records without build metadata retain the CommandRequest contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: './fleet.yaml#/components/schemas/CommandRequest'
                - $ref: './fleet.yaml#/components/schemas/BuildCancel'
      responses:
        '202':
          description: Durable intent; execution may still be pending
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      command: {$ref: './fleet.yaml#/components/schemas/Command'}
                      status: {type: string, enum: [pending, accepted, completed, failed, superseded]}
                  - $ref: './fleet.yaml#/components/schemas/BuildCancelResponse'
        '400': {$ref: './fleet.yaml#/components/responses/Invalid'}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
        '507': {$ref: './fleet.yaml#/components/responses/Full'}
  /v1/fleet/{kind}/{id}/ack:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Kind'
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetAcknowledge
      summary: Persist an idempotent worker command receipt
      description: >-
        Validates command identity, ownership, and generation before recording
        acknowledgment. Typed subordinate builds reject generic ACK; their trusted
        terminal fact path is build-jobs/{id}/facts and requires a dedicated key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/Acknowledgment'}
      responses:
        '200': {$ref: './fleet.yaml#/components/responses/Acknowledged'}
        '400': {$ref: './fleet.yaml#/components/responses/Invalid'}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
  /v1/fleet/{kind}/{id}/resolve:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Kind'
      - $ref: './fleet.yaml#/components/parameters/Id'
    post:
      tags: [fleet]
      operationId: fleetResolve
      summary: Record an explicit manual orchestration decision for inactive work
      description: >-
        Applies to sessions, executions and legacy generic build-jobs with a canonical task.
        Typed subordinate builds cannot resolve a canonical task through this path.
        Disabled unless a separate operator resolution key is configured.
        An evidence reference does not verify approval. The persisted resolution
        is manual with verifiedApproval false and cannot establish independently
        approved acceptance work. Reuse the same decision after uncertain writes.
      security:
        - bearerAuth: []
          resolutionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './fleet.yaml#/components/schemas/ManualDecision'}
      responses:
        '200':
          description: Canonical outcome and Fleet release are durably acknowledged
          content:
            application/json:
              schema: {$ref: './fleet.yaml#/components/schemas/Record'}
        '400': {$ref: './fleet.yaml#/components/responses/Invalid'}
        '403': {description: Separate operator credential required}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
  /v1/fleet/commands/{id}:
    parameters:
      - $ref: './fleet.yaml#/components/parameters/Id'
    get:
      tags: [fleet]
      operationId: fleetVerifyCommand
      summary: Verify immutable durable intent against current ownership
      description: >-
        This read gate is for an attachment adapter, not another work queue.
        It also returns retained typed build commands; reading a start command
        does not substitute for the dedicated supervisor claim-run grant.
      responses:
        '200':
          description: Original command, receipt status, and current resource
          content:
            application/json:
              schema:
                type: object
                required: [command, status, record]
                properties:
                  command: {$ref: './fleet.yaml#/components/schemas/FleetReadableCommand'}
                  status: {type: string}
                  record: {$ref: './fleet.yaml#/components/schemas/FleetReadableRecord'}
        '404': {$ref: './fleet.yaml#/components/responses/Missing'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
  /v1/fleet/events:
    get:
      tags: [fleet]
      operationId: fleetEvents
      summary: Replay durable control transitions
      description: >-
        The cursor covers persisted control transitions only. High-volume activity
        has a worker sourceSequence and is visible in current resource observations.
        A cursor ahead of this controller requires resynchronization and returns 409.
        Typed build entries carry compact buildTransition status/reservation fields
        instead of a record copy. Exact replay and log polling append no events.
      parameters:
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Ordered control transitions
          content:
            application/json:
              schema:
                type: object
                required: [events, cursor]
                properties:
                  events:
                    type: array
                    items: {$ref: './fleet.yaml#/components/schemas/FleetReadableTransition'}
                  cursor: {type: integer, minimum: 0}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}
    post:
      tags: [fleet]
      operationId: fleetObserve
      summary: Accept a versioned worker fact through Agamemnon
      description: >-
        Applies fenced command receipts or observed activity without authorizing
        issue completion. Typed build grants and terminal facts are rejected here;
        the dedicated claim-run/facts paths require a separately bound supervisor key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: './fleet.yaml#/components/schemas/Activity'
                - $ref: './fleet.yaml#/components/schemas/Acknowledgment'
      responses:
        '200': {$ref: './fleet.yaml#/components/responses/Acknowledged'}
        '400': {$ref: './fleet.yaml#/components/responses/Invalid'}
        '409': {$ref: './fleet.yaml#/components/responses/Conflict'}
        '503': {$ref: './fleet.yaml#/components/responses/Unavailable'}

  # ── Health / version ──────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Root health check
      description: Unauthenticated liveness probe. Returns service name.
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootHealth"
              example:
                status: ok
                service: Agamemnon

  /v1/health:
    get:
      operationId: getV1Health
      tags: [health]
      summary: Versioned health check
      description: Preferred liveness probe for v1 clients.
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /v1/version:
    get:
      operationId: getVersion
      tags: [health]
      summary: Service version
      responses:
        "200":
          description: Current service version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: "0.1.0"
                name: Agamemnon

  # ── Agents ────────────────────────────────────────────────────────────────────

  /v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Array of all registered agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"

    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a generic agent
      description: |
        Creates a new agent and stores it in-memory. The agent's initial `status` is always
        `offline` regardless of what is supplied in the request body.

        Publishes to NATS: `hi.agents.{host}.{name}.created`
      x-nats-events:
        - subject: "hi.agents.{host}.{name}.created"
          trigger: always
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
            example:
              name: my-agent
              role: worker
              host: local
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # NOTE: `/v1/agents/docker` was removed in issue #144. It was a deduplicated alias of
  # `POST /v1/agents` with no docker-specific logic. Docker-hosted agents are now created
  # via `POST /v1/agents` with `{"host": "docker", "image": "..."}`; the resulting NATS
  # subject `hi.agents.docker.{name}.created` is unchanged.

  /v1/agents/by-name/{name}:
    get:
      operationId: getAgentByName
      tags: [agents]
      summary: Get agent by name
      description: |
        Looks up an agent by its `name` field. Returns 404 if no agent has that name.

        **Registration order:** Registered before the generic `GET /v1/agents/{id}` route in
        cpp-httplib, so `/v1/agents/by-name/foo` is not misrouted.
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWrapper"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWrapper"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Partially update agent fields
      description: |
        Merges the supplied fields into the stored agent. The `id` and `createdAt` fields are
        immutable and are silently ignored if present in the body.

        Publishes to NATS: `hi.agents.{host}.{name}.updated`
      x-nats-events:
        - subject: "hi.agents.{host}.{name}.updated"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete agent
      description: |
        Removes the agent from the in-memory store.

        Publishes to NATS: `hi.agents.{host}.{name}.deleted`
      x-nats-events:
        - subject: "hi.agents.{host}.{name}.deleted"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}/start:
    post:
      operationId: startAgent
      tags: [agents]
      summary: Start agent
      description: |
        Sets the agent's `status` to `online`.

        Publishes to NATS: `hi.agents.{host}.{name}.updated`
      x-nats-events:
        - subject: "hi.agents.{host}.{name}.updated"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
              example:
                status: online
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}/stop:
    post:
      operationId: stopAgent
      tags: [agents]
      summary: Stop agent
      description: |
        Sets the agent's `status` to `offline`.

        Publishes to NATS: `hi.agents.{host}.{name}.updated`
      x-nats-events:
        - subject: "hi.agents.{host}.{name}.updated"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
              example:
                status: offline
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Teams ─────────────────────────────────────────────────────────────────────

  /v1/teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Array of all teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      description: |
        Publishes to NATS: `hi.agents.team.created`
      x-nats-events:
        - subject: "hi.agents.team.created"
          trigger: always
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
            example:
              name: alpha-team
              agentIds:
                - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get team by ID
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWrapper"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateTeam
      tags: [teams]
      summary: Replace team fields
      description: |
        Updates `name` and/or `agentIds` on the team. Accepts both `agentIds` (camelCase) and
        `agent_ids` (snake_case) for the agent list field; the stored value is always `agentIds`.

        Only `name` and `agentIds` are updatable; other fields are ignored.

        Publishes to NATS: `hi.agents.team.updated`
      x-nats-events:
        - subject: "hi.agents.team.updated"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete team
      description: |
        Publishes to NATS: `hi.agents.team.deleted`
      x-nats-events:
        - subject: "hi.agents.team.deleted"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Tasks ─────────────────────────────────────────────────────────────────────

  /v1/tasks:
    get:
      operationId: listAllTasks
      tags: [tasks]
      summary: List all tasks across all teams
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Array of all tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"

  /v1/teams/{team_id}/tasks:
    get:
      operationId: listTeamTasks
      tags: [tasks]
      summary: List tasks for a team
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Array of tasks belonging to this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"

    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: |
        Creates a new task scoped to the team. The task's initial `status` is always `pending`
        and `completedAt` is always `null`.

        After creation two NATS publishes occur:
        1. `hi.tasks.created` — full task payload
        2. `hi.myrmidon.{type}.{task_id}` — dispatches work to myrmidon pull queue
      x-nats-events:
        - subject: "hi.tasks.created"
          trigger: always
        - subject: "hi.myrmidon.{type}.{task_id}"
          trigger: always
          description: Dispatches task to the myrmidon work queue (PULL consumer, MaxAckPending=1)
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
            example:
              subject: Implement login endpoint
              description: Add POST /auth/login with JWT response
              type: implementation
              assigneeAgentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/teams/{team_id}/tasks/{task_id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task by ID
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrapper"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateTaskFull
      tags: [tasks]
      summary: Update task (full merge)
      description: |
        Merges all supplied fields into the stored task. The `id`, `teamId`, and `createdAt`
        fields are immutable and silently ignored.

        If `status` is set to `completed` and `completedAt` is currently `null`, `completedAt`
        is automatically set to the current UTC timestamp.

        **Used by Telemachy** (the myrmidon completion protocol) to report task results.

        Publishes to NATS: `hi.tasks.{team_id}.{task_id}.updated`
        If `status == "completed"`, also logs to: `hi.logs.agamemnon.task_completed`
      x-nats-events:
        - subject: "hi.tasks.{team_id}.{task_id}.updated"
          trigger: always
        - subject: "hi.logs.agamemnon.task_completed"
          trigger: "when status == completed"
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
            example:
              status: completed
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Partially update task fields
      description: |
        Identical merge semantics to `PUT /v1/teams/{team_id}/tasks/{task_id}`. The HTTP method
        distinction (PUT vs PATCH) is preserved for semantic clarity but the server-side
        implementation is the same.

        Publishes to NATS: `hi.tasks.{team_id}.{task_id}.updated`
        If `status == "completed"`, also logs to: `hi.logs.agamemnon.task_completed`
      x-nats-events:
        - subject: "hi.tasks.{team_id}.{task_id}.updated"
          trigger: always
        - subject: "hi.logs.agamemnon.task_completed"
          trigger: "when status == completed"
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrapper"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Workflows ─────────────────────────────────────────────────────────────────

  /v1/workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows (stub)
      description: |
        **Not yet implemented.** Returns an empty array. This endpoint is a placeholder for
        future workflow orchestration support.
      x-not-implemented: true
      responses:
        "200":
          description: Empty workflow list (stub response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
              example:
                workflows: []

  # ── HMAS Orchestration ────────────────────────────────────────────────────────

  /v1/briefs:
    post:
      operationId: submitBrief
      tags: [HMAS]
      summary: Submit a TaskBrief for HMAS orchestration
      description: |
        Accepts a researched `TaskBrief` (title, description, repos, modules,
        per-module impl notes) and registers it with the orchestrator. The
        orchestrator decomposes the brief into a tree of HMAS tasks and returns
        the resulting plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskBrief"
            example:
              title: Wire X-API-Key header into SDK
              description: Auth roundtrip implementation
              repos: ["Agamemnon"]
              modules:
                Agamemnon: ["clients/python"]
              impls:
                Agamemnon:
                  clients/python: ["Add api_key to AgamemnonConfig"]
      responses:
        "201":
          description: Brief submitted; returns the generated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmasPlan"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/briefs/{id}/plan:
    get:
      operationId: getBriefPlan
      tags: [HMAS]
      summary: Retrieve the HMAS task tree for a brief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Brief ID returned by `POST /v1/briefs`
      responses:
        "200":
          description: Plan found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmasPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks/{id}/escalate:
    post:
      operationId: escalateHmasTask
      tags: [HMAS]
      summary: Escalate an in-progress HMAS task
      description: |
        Escalates the task to the parent layer in the HMAS hierarchy. The escalation
        record (with `reason` and `from_layer`) is appended to the task's
        `escalations` array and published to NATS.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: HMAS task ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HmasEscalateRequest"
            example:
              reason: blocked on upstream decision
      responses:
        "200":
          description: Task escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmasEscalateResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks/{id}/complete:
    post:
      operationId: completeHmasTask
      tags: [HMAS]
      summary: Mark an HMAS task as completed
      description: |
        Reports completion of an HMAS task (used by myrmidons via the Telemachy
        completion protocol). The orchestrator records the completion and may
        unblock dependent tasks. Fleet-owned tasks return 409 and require the
        separate reviewed Fleet resolution path.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: HMAS task ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional completion payload (free-form for now)
              additionalProperties: true
      responses:
        "200":
          description: Task marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmasCompleteResponse"
        "409":
          description: Fleet ownership requires generation-fenced reviewed resolution
        "503":
          description: Canonical completion was not acknowledged

  /v1/tasks/{id}/state:
    get:
      operationId: getHmasTaskState
      tags: [HMAS]
      summary: Get current HMAS task state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: HMAS task ID
      responses:
        "200":
          description: HMAS task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmasTaskStateResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Chaos ─────────────────────────────────────────────────────────────────────

  /v1/chaos:
    get:
      operationId: listFaults
      tags: [chaos]
      summary: List registered chaos faults
      description: |
        Returns the fault registry. **Registry only — fault injection is not
        yet wired into the request pipeline.** Registered faults are visible
        here and broadcast over NATS, but the server does not apply latency,
        partition, crash, or error behaviour based on them.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Array of registered faults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultList"

  /v1/chaos/{type}:
    post:
      operationId: injectFault
      tags: [chaos]
      summary: Register a chaos fault (registry only)
      description: |
        **Registry only — fault injection forthcoming.** This endpoint
        records the fault declaration in the in-memory fault store and
        publishes a NATS event, but the Agamemnon server does NOT itself
        apply the declared behaviour to subsequent requests. External
        chaos drivers (e.g. ProjectCharybdis) consume the broadcast to
        drive their own injection logic.

        The fault type is taken **entirely from the URL path parameter**. Any
        request body sent with this call is silently ignored — the underlying
        `Store::create_fault(type)` API does not accept configuration. Callers
        that want to pass parameters (duration, intensity, etc.) must encode
        them into the `type` segment until the API is extended.

        Publishes to NATS: `hi.agents.chaos.injected`
      x-nats-events:
        - subject: "hi.agents.chaos.injected"
          trigger: always
      parameters:
        - $ref: "#/components/parameters/FaultType"
      responses:
        "201":
          description: Fault registered (not yet enforced — see endpoint description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultWrapper"
    delete:
      operationId: removeFault
      tags: [chaos]
      summary: Remove a chaos fault from the registry
      description: |
        Removes the fault by ID from the registry. **Registry only — see
        the POST endpoint description for details on the not-yet-wired
        injection behaviour.**

        Publishes to NATS: `hi.agents.chaos.removed`
      x-nats-events:
        - subject: "hi.agents.chaos.removed"
          trigger: always
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: Fault ID (same parameter reused for backward compatibility)
      responses:
        "200":
          description: Fault removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"

# ── Components ────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    buildKey:
      $ref: './fleet.yaml#/components/securitySchemes/buildKey'
    resolutionKey:
      type: apiKey
      in: header
      name: X-Fleet-Resolution-Key
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key supplied as `Authorization: Bearer <key>`. The expected key is the
        value of the server's required `AGAMEMNON_API_KEY` environment variable.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key supplied as `X-API-Key: <key>`. The expected key is the value of
        the server's required `AGAMEMNON_API_KEY` environment variable.

  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      description: |
        Maximum number of items to return. Defaults to 100; capped at 1000.
        Values outside the allowed range may be silently clamped by the server.

    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      description: |
        Number of items to skip before starting to return results. Pair with
        `limit` to paginate through large collections.

    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Agent UUID

    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Agent name (exact match)

    TeamId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Team UUID

    TeamIdPath:
      name: team_id
      in: path
      required: true
      schema:
        type: string
      description: Team UUID

    TaskIdPath:
      name: task_id
      in: path
      required: true
      schema:
        type: string
      description: Task UUID

    FaultType:
      name: type
      in: path
      required: true
      schema:
        type: string
      description: Fault type identifier (e.g. `latency`, `drop`, `corrupt`)

  responses:
    BadRequest:
      description: Invalid JSON body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "invalid JSON: ..."

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "agent not found"

  schemas:

    # ── Health ──────────────────────────────────────────────────────────────

    RootHealth:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: Agamemnon

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Version:
      type: object
      required: [version, name]
      properties:
        version:
          type: string
          example: "0.1.0"
        name:
          type: string
          example: Agamemnon

    # ── Shared ──────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Deleted:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
          description: ID of the deleted resource

    # ── Agents ──────────────────────────────────────────────────────────────

    Agent:
      type: object
      required: [id, name, status, createdAt]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name: my-agent
        label: ""
        program: ""
        workingDirectory: ""
        programArgs: []
        taskDescription: ""
        tags: []
        owner: ""
        role: worker
        host: local
        status: offline
        createdAt: "2026-01-01T00:00:00Z"
      properties:
        id:
          type: string
          description: UUID v4 assigned at creation
        name:
          type: string
          default: unnamed
        label:
          type: string
          default: ""
        program:
          type: string
          description: Executable path or command
          default: ""
        workingDirectory:
          type: string
          default: ""
        programArgs:
          type: array
          items:
            type: string
          default: []
        taskDescription:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        owner:
          type: string
          default: ""
        role:
          type: string
          default: worker
        host:
          type: string
          description: "Host identifier; `docker` for Docker agents"
          default: local
        status:
          type: string
          enum: [online, offline, error]
          description: |
            Set to `offline` at creation; changed by `/start` (`online`) and `/stop`
            (`offline`). May also be `error` if the agent reports a fatal failure.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp

    AgentCreate:
      type: object
      properties:
        name:
          type: string
          default: unnamed
        label:
          type: string
        program:
          type: string
        workingDirectory:
          type: string
        programArgs:
          type: array
          items:
            type: string
        taskDescription:
          type: string
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        role:
          type: string
          default: worker
        host:
          type: string
          default: local

    AgentPatch:
      type: object
      description: Any Agent fields except `id` and `createdAt`
      properties:
        name:
          type: string
        label:
          type: string
        program:
          type: string
        workingDirectory:
          type: string
        programArgs:
          type: array
          items:
            type: string
        taskDescription:
          type: string
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        role:
          type: string
        host:
          type: string
        status:
          type: string
          enum: [online, offline, error]

    AgentWrapper:
      type: object
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"

    AgentCreateResponse:
      type: object
      required: [id, agent]
      properties:
        id:
          type: string
          description: UUID of the created agent
        agent:
          $ref: "#/components/schemas/Agent"

    AgentStatusResponse:
      type: object
      required: [status, id]
      properties:
        status:
          type: string
          enum: [online, offline, error]
        id:
          type: string

    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"

    # ── Teams ───────────────────────────────────────────────────────────────

    Team:
      type: object
      required: [id, name, agentIds, createdAt]
      example:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name: alpha-team
        agentIds:
          - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        createdAt: "2026-01-01T00:00:00Z"
      properties:
        id:
          type: string
        name:
          type: string
          default: unnamed-team
        agentIds:
          type: array
          items:
            type: string
          description: UUIDs of agents assigned to this team
          default: []
        createdAt:
          type: string
          format: date-time

    TeamCreate:
      type: object
      properties:
        name:
          type: string
          default: unnamed-team
        agentIds:
          type: array
          items:
            type: string
          description: Also accepted as `agent_ids` (snake_case alias)
        agent_ids:
          type: array
          items:
            type: string
          description: Snake_case alias for `agentIds`

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        agentIds:
          type: array
          items:
            type: string
          description: Also accepted as `agent_ids`
        agent_ids:
          type: array
          items:
            type: string

    TeamWrapper:
      type: object
      required: [team]
      properties:
        team:
          $ref: "#/components/schemas/Team"

    TeamList:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"

    # ── Tasks ───────────────────────────────────────────────────────────────

    Task:
      type: object
      required: [id, teamId, subject, status, createdAt]
      example:
        id: "c1d2e3f4-a5b6-7890-cdef-012345678901"
        teamId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        subject: Implement login endpoint
        description: Add POST /auth/login with JWT response
        assigneeAgentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        blockedBy: []
        type: implementation
        status: pending
        createdAt: "2026-01-01T00:00:00Z"
        completedAt: null
      properties:
        id:
          type: string
        teamId:
          type: string
        subject:
          type: string
          default: ""
        description:
          type: string
          default: ""
        assigneeAgentId:
          type: string
          description: UUID of the assigned agent (empty string if unassigned)
          default: ""
        blockedBy:
          type: array
          items:
            type: string
          description: Task IDs this task is blocked by
          default: []
        type:
          type: string
          description: Task type; used to route to myrmidon work queue (`hi.myrmidon.{type}.{id}`)
          default: general
        status:
          type: string
          enum: [pending, running, completed, failed, blocked]
          default: pending
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
          description: Set automatically when `status` transitions to `completed`

    TaskCreate:
      type: object
      properties:
        subject:
          type: string
        description:
          type: string
        assigneeAgentId:
          type: string
        blockedBy:
          type: array
          items:
            type: string
        type:
          type: string
          default: general

    TaskUpdate:
      type: object
      description: Any Task fields except `id`, `teamId`, and `createdAt`
      properties:
        subject:
          type: string
        description:
          type: string
        assigneeAgentId:
          type: string
        blockedBy:
          type: array
          items:
            type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, blocked]

    TaskWrapper:
      type: object
      required: [task]
      properties:
        task:
          $ref: "#/components/schemas/Task"

    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    # ── Workflows ───────────────────────────────────────────────────────────

    WorkflowList:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items: {}
          description: Always empty in Phase 1

    # ── Chaos ───────────────────────────────────────────────────────────────

    Fault:
      type: object
      required: [id, type, active, createdAt]
      example:
        id: "f0a1b2c3-d4e5-6789-fa0b-1c2d3e4f5a6b"
        type: latency
        active: true
        createdAt: "2026-01-01T00:00:00Z"
      properties:
        id:
          type: string
        type:
          type: string
          description: Fault type (e.g. `latency`, `drop`, `corrupt`)
        active:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time

    FaultWrapper:
      type: object
      required: [fault]
      properties:
        fault:
          $ref: "#/components/schemas/Fault"

    FaultList:
      type: object
      required: [faults]
      properties:
        faults:
          type: array
          items:
            $ref: "#/components/schemas/Fault"

    # ── HMAS ────────────────────────────────────────────────────────────────

    HmasLayer:
      type: string
      enum: [L0_ChiefArchitect, L1_ComponentLead, L2_ModuleLead, L3_TaskAgent]
      description: HMAS hierarchy layer (L0 highest, L3 lowest)

    HmasTaskState:
      type: string
      enum: [Pending, Decomposing, Delegated, InProgress, Escalated, Completed, Failed]
      description: HMAS task state machine value

    HmasEscalationRecord:
      type: object
      required: [task_id, reason, escalated_at, from_layer]
      properties:
        task_id:
          type: string
        reason:
          type: string
        escalated_at:
          type: string
          format: date-time
        from_layer:
          $ref: "#/components/schemas/HmasLayer"

    HmasTask:
      type: object
      required:
        - id
        - brief_id
        - layer
        - state
        - subject
        - blocked_by
        - child_task_ids
        - escalations
      properties:
        id:
          type: string
        brief_id:
          type: string
        parent_task_id:
          type: string
          description: Empty string for the root task
        layer:
          $ref: "#/components/schemas/HmasLayer"
        state:
          $ref: "#/components/schemas/HmasTaskState"
        subject:
          type: string
        description:
          type: string
        repo:
          type: string
        module:
          type: string
        assigned_lead_id:
          type: string
        fleet_claim:
          $ref: './fleet.yaml#/components/schemas/CanonicalClaim'
        fleet_resolution:
          $ref: './fleet.yaml#/components/schemas/Resolution'
        delivery:
          type: object
          description: >-
            Orchestrator-owned durable checkpoints and immutable intake provenance;
            neither is a task-state authority. Generic updates retain researchIntake
            or issueIntake exactly, including numeric types. New work acquisition
            also respects retained ownership and unresolved shared creation attempts,
            even when import routes or configuration are disabled.
          properties:
            researchIntake: {$ref: './fleet.yaml#/components/schemas/ResearchProvenance'}
            issueIntake: {$ref: './fleet.yaml#/components/schemas/IssueProvenance'}
          additionalProperties: true
        blocked_by:
          type: array
          items:
            type: string
        child_task_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
        escalations:
          type: array
          items:
            $ref: "#/components/schemas/HmasEscalationRecord"

    TaskBrief:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: Optional client-supplied ID; server generates one if omitted
        title:
          type: string
        description:
          type: string
        repos:
          type: array
          items:
            type: string
          description: Repos in scope for this brief
        modules:
          type: object
          description: Map of repo → list of module names
          additionalProperties:
            type: array
            items:
              type: string
        impls:
          type: object
          description: Nested map repo → module → list of implementation tasks
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string

    HmasPlan:
      type: object
      required: [brief_id, root, tasks]
      properties:
        brief_id:
          type: string
        root:
          oneOf:
            - $ref: "#/components/schemas/HmasTask"
            - type: "null"
          description: Root task of the plan tree, or null if no tasks were generated
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/HmasTask"

    HmasEscalateRequest:
      type: object
      properties:
        reason:
          type: string
          description: Free-form escalation reason; defaults to "unspecified"
          default: unspecified

    HmasEscalateResponse:
      type: object
      required: [task_id, escalated]
      properties:
        task_id:
          type: string
        escalated:
          type: boolean

    HmasCompleteResponse:
      type: object
      required: [task_id, completed]
      properties:
        task_id:
          type: string
        completed:
          type: boolean

    HmasTaskStateResponse:
      type: object
      required: [task_id, state, layer, task]
      properties:
        task_id:
          type: string
        state:
          $ref: "#/components/schemas/HmasTaskState"
        layer:
          $ref: "#/components/schemas/HmasLayer"
        task:
          $ref: "#/components/schemas/HmasTask"
